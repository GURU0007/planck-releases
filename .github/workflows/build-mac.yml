name: Build macOS & Windows Stealth Desktop Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: npm install

      - name: Package macOS Universal Electron App (Apple Silicon & Intel)
        run: |
          npx @electron/packager . Planck-Stealth --platform=darwin --arch=universal --out=dist --overwrite

      - name: Create Native macOS DMG with Applications Symlink
        run: |
          APP_PATH=$(find dist -name "Planck-Stealth.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p dmg_root
          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Planck-Stealth" -srcfolder dmg_root -ov -format UDZO dist/Planck-Stealth-Mac.dmg
          ls -lh dist/Planck-Stealth-Mac.dmg

      - name: Upload DMG to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist/Planck-Stealth-Mac.dmg --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: npm install

      - name: Package Windows x64 App
        run: |
          npx @electron/packager . Planck-Stealth --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile 1-Click Setup.exe with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          Get-Item dist/Planck-Stealth-Setup.exe

      - name: Create Windows ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Planck-Stealth-win32-x64/* -DestinationPath dist/Planck-Stealth-Windows.zip -Force
          Get-Item dist/Planck-Stealth-Windows.zip

      - name: Upload Windows Executable and ZIP to GitHub Release v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist/Planck-Stealth-Setup.exe dist/Planck-Stealth-Windows.zip --clobber
